
name: Build APK and AAB

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name nokhba \
            --org dev.workers.ammaralhaddar83 .

      - name: Set application ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          target = "dev.workers.ammaralhaddar83.nokhba.twa"

          candidates = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts")
          ]

          gradle = next((p for p in candidates if p.exists()), None)

          if gradle is None:
              raise SystemExit("Gradle app file not found")

          content = gradle.read_text()

          pattern = r'(?m)^(\s*applicationId\s+)(?:=\s*)?["\'][^"\']+["\']'
          updated, count = re.subn(
              pattern,
              lambda m: m.group(1) + f'"{target}"',
              content
          )

          if count != 1:
              raise SystemExit("Could not safely set applicationId")

          gradle.write_text(updated)
          print("Application ID set to:", target)
          PY

      - name: Configure Android Manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml

          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"

          sed -i 's#android:label="[^"]*"#android:label="نخبة"#' "$M"

      - name: Get dependencies
        run: flutter pub get

      - name: Verify application ID
        run: |
          grep -n "applicationId" android/app/build.gradle* || true

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nokhba-flutter-test-build
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
